# ─────────────────────────────────────────────────────────────────────────────
# Pipeline Sequencial: Veg_sec -> Down -> Burn -> Queimadas -> Borda
# ─────────────────────────────────────────────────────────────────────────────


services:

  npi_tables:
    build:
      context: .
      dockerfile: Dockerfile
    image: npi-geo:latest
    container_name: npi_tables
    volumes:
      - ./:/app:delegated
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python3", "compare_maps_condicao.py"]
    restart: "no"